okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyaml" }
material-about = { group = "com.github.daniel-stoneuk", name = "material-about-library", version.ref = "material-about" }
process-phoenix = { group = "com.jakewharton", name = "process-phoenix", version.ref = "process-phoenix" }
kryo = { group = "com.esotericsoftware", name = "kryo", version.ref = "kryo" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
recyclerview-fastscroll = { group = "com.simplecityapps", name = "recyclerview-fastscroll", version.ref = "recyclerview-fastscroll" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar-jdk-libs" }

[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
