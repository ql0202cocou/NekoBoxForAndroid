[versions]
# Gradle plugin (root build.gradle.kts); AGP / Kotlin plugin versions stay in buildSrc
ksp = "2.3.12"

kotlinx-coroutines = "1.11.0"
androidx-core = "1.19.0"
androidx-recyclerview = "1.4.0"
androidx-activity = "1.13.0"
androidx-fragment = "1.9.0"
androidx-browser = "1.10.0"
androidx-swiperefreshlayout = "1.2.0"
androidx-constraintlayout = "2.2.2"
androidx-navigation = "2.10.1"
androidx-preference = "1.2.1"
androidx-appcompat = "1.8.0"
androidx-work = "2.11.2"
androidx-room = "2.8.5"

material = "1.14.0"
gson = "2.14.0"
zxing-lite = "3.5.0"
blacksquircle = "2.9.0"
okhttp = "5.5.0"
snakeyaml = "2.7"
material-about = "3.2.0-rc01"
process-phoenix = "3.0.0"
kryo = "5.6.2"
guava = "33.7.1-android"
recyclerview-fastscroll = "2.0.1"
desugar-jdk-libs = "2.1.5"

[libraries]
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidx-recyclerview" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidx-activity" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidx-fragment" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "androidx-browser" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "androidx-swiperefreshlayout" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "androidx-navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "androidx-navigation" }
androidx-preference-ktx = { group = "androidx.preference", name = "preference-ktx", version.ref = "androidx-preference" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidx-work" }
androidx-work-multiprocess = { group = "androidx.work", name = "work-multiprocess", version.ref = "androidx-work" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidx-room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidx-room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "androidx-room" }

material = { group = "com.google.android.material", name = "material", version.ref = "material" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
zxing-lite = { group = "com.github.jenly1314", name = "zxing-lite", version.ref = "zxing-lite" }
blacksquircle-editorkit = { group = "com.blacksquircle.ui", name = "editorkit", version.ref = "blacksquircle" }
