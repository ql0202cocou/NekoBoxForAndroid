name: Build APK
on:
  workflow_call:
    inputs:
      gradle-task:
        description: "Gradle assemble task to run"
        required: true
        type: string
      ref:
        description: "Git ref to check out (empty = caller's ref)"
        required: false
        type: string
      retention-days:
        description: "Retention of the APKs artifact in days (release uses the default; preview has no publish job so the artifact is the only product)"
        required: false
        type: number
        default: 1
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Download LibCore
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libcore-aar
          path: app/libs
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Plugin cores cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/executableSo
          key: plugins-${{ hashFiles('buildScript/lib/plugins.sh') }}
      - name: Install SDK 37
        # Lives here rather than in buildScript/ so it stays off the F-Droid prebuild path.
        run: |
          # API 37 platforms carry a minor version in the package/dir name (android-37.0); build-tools stay 36.0.0 (AGP 9.1 minimum, also the apksigner used below)
          if [ ! -d "$ANDROID_HOME/platforms/android-37.0" ] || [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
          fi
      - name: Gradle Build
        env:
          # assets.sh resolves the latest geoip/geosite release via the GitHub API;
          # unauthenticated calls from shared runner IPs hit the 60/h rate limit.
          GITHUB_TOKEN: ${{ github.token }}
          # secrets reach the shell through env, never interpolated into the script
          # body (same rule as the tag in release.yml); Helpers.kt reads LOCAL_PROPERTIES
          GRADLE_TASK: ${{ inputs.gradle-task }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          # only point ndk.dir at NDK 25 when it is actually installed; the app has
          # no externalNativeBuild, and a dangling path just spams CXX1102 warnings
          if [ -d "${ANDROID_HOME}/ndk/25.0.8775105" ]; then
            echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          ./run init action gradle
          ./gradlew "$GRADLE_TASK"
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::no arm64-v8a APK found under app/build/outputs/apk; aborting upload (an empty path would upload the whole workspace, including release.keystore and local.properties)"
            exit 1
          fi
          echo "APK=$(dirname "$APK")" >> $GITHUB_ENV
      - name: Verify APK signature
        # Release builds (oss AND preview — signing is buildType-level in Helpers.kt) must be
        # signed by the release certificate. Helpers.kt only wires the signing config when
        # KEYSTORE_PASS exists, so a missing KEYSTORE_BASE64/LOCAL_PROPERTIES secret silently
        # produces unsigned APKs (an empty decoded keystore file fails the same way), and a
        # secret pointing at some other keystore would still verify. Fail loudly before upload.
        env:
          # `apksigner verify --print-certs` on any published APK prints this digest
          EXPECTED_CERT_SHA256: f1e8777b6ed766dffc87f6772d7002c2ed5d0ff1b21c75f0e7f80c651a1958c6
        run: |
          FAILED=0
          while IFS= read -r apk; do
            CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" 2>/dev/null \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$apk is unsigned or signed with an unexpected certificate (${CERT:-none})"
              FAILED=1
            fi
          done < <(find app/build/outputs/apk -name '*.apk')
          exit $FAILED
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: APKs
          path: ${{ env.APK }}
          # release: hand-off for the publish job only; published APKs live as release assets
          # preview: no publish job — the artifact IS the product, so preview.yml passes 7
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
