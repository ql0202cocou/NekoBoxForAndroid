name: Preview Build
on:
  workflow_dispatch:
# one preview build per ref at a time (see release.yml)
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false
# Least privilege for every job; reusable workflows cannot exceed this.
permissions:
  contents: read
  actions: read
jobs:
  libcore:
    uses: ./.github/workflows/libcore.yml
  build:
    needs: libcore
    uses: ./.github/workflows/build-apk.yml
    with:
      gradle-task: app:assemblePreviewRelease
      # no publish job here: the artifact is the only product, keep it downloadable
      # until the manual prerelease is cut (default 1 day would be gone by then)
      retention-days: 7
    secrets: inherit
