name: Release Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag"
        required: true
      skip_publish:
        description: "Skip publishing to GitHub Releases (set y to skip)"
        required: false
      prerelease:
        description: "Publish as a pre-release, never marked Latest (set y)"
        required: false
# 同一 tag 同时只跑一次：并发的两次运行会先后删除并重建同一个 release，后一次覆盖
# 前一次的 APK。不取消进行中的运行：发布到一半不能被中断
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
# Least privilege for every job; the publish job widens contents to write.
# Reusable workflows cannot exceed what is granted here.
permissions:
  contents: read
  actions: read
# runs-on 固定为 ubuntu-24.04，原因见 libcore.yml
jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Check VERSION_NAME matches the tag
        # tag 必须等于该提交上的 VERSION_NAME，否则发布出的 release 名与 APK 版本不符。
        # 预览 tag（如 1.7.2-a1）同理，其 nb4a.properties 里就是预览版的 VERSION_NAME。
        # tag 只经 env 传入，不插值进脚本正文
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(grep '^VERSION_NAME=' nb4a.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::inputs.tag ($TAG) does not match VERSION_NAME ($VERSION) in nb4a.properties"
            exit 1
          fi
      - name: Check y/empty inputs
        # skip_publish / prerelease 只认 y 或留空：publish 的判断在表达式里做且不区分
        # 大小写，填 yes、true、1 都会真的发布并删除重建 release；Y 在下面
        # 的 shell 判断里又不算预览版。输入同样只经 env 传入
        env:
          SKIP_PUBLISH: ${{ inputs.skip_publish }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          for pair in "skip_publish=$SKIP_PUBLISH" "prerelease=$PRERELEASE"; do
            case "${pair#*=}" in
              ""|y) ;;
              *)
                echo "::error::${pair%%=*} must be y or empty, got '${pair#*=}'"
                exit 1
                ;;
            esac
          done
      - name: Check prerelease matches the tag
        # 预览版 tag（-aN / -bN）必须带 prerelease=y，正式版不能带：漏填或写成 Y
        # 时预览版会作为正式版发布并顶掉 Latest。在构建前就拦下；输入同样只经 env 传入
        env:
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$TAG" =~ -[ab][0-9]+$ ]]; then
            if [ "$PRERELEASE" != "y" ]; then
              echo "::error::preview tag $TAG must be published with prerelease=y"
              exit 1
            fi
          elif [ "$PRERELEASE" = "y" ]; then
            echo "::error::stable tag $TAG must not be published as a pre-release"
            exit 1
          fi
  libcore:
    needs: validate
    uses: ./.github/workflows/libcore.yml
    with:
      ref: ${{ inputs.tag }}
  build:
    needs: libcore
    uses: ./.github/workflows/build-apk.yml
    with:
      gradle-task: app:assembleOssRelease
      ref: ${{ inputs.tag }}
    secrets: inherit
  publish:
    name: Publish Release
    if: github.event.inputs.skip_publish != 'y'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: APKs
          path: artifacts
      - name: Release
        env:
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          # gh 是 runner 预装的官方 CLI，不再下载第三方发布工具
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir apks
          # 发布策略：只发 universal APK；各 ABI 分包在 build job 里构建并校验，但不作为附件发布
          find artifacts -name "*-universal.apk" -exec cp {} apks \;
          if [ -z "$(ls -A apks)" ]; then
            echo "::error::no universal APK to publish; aborting before the existing release is deleted"
            exit 1
          fi
          # 是否标为 Latest 在删除旧 release 之前算好：删了再查，重跑当前正式版时
          # 查到的是上一版。只有不低于当前 Latest 的正式版才标 Latest，重跑旧 tag
          # 不会顶掉它；还没有任何 release 时查询失败，按首发处理。
          # 预览版在创建时就带 --prerelease：事后再改的话，发布后到改完之间它是
          # 正式 release，会短暂顶掉 Latest
          FLAGS=(--latest=false)
          if [ "$PRERELEASE" = "y" ]; then
            FLAGS+=(--prerelease)
          else
            CURRENT=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
            if [ -z "$CURRENT" ] || [ "$(printf '%s\n%s\n' "$CURRENT" "$TAG" | sort -V | tail -n 1)" = "$TAG" ]; then
              FLAGS=(--latest=true)
            fi
          fi
          # 只删 release、保留 tag：validate job 已按这个 tag 检出，它必然存在，
          # --verify-tag 让重建直接复用它，tag 始终指向构建这些 APK 的提交
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "" "${FLAGS[@]}" apks/*
