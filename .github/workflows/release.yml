name: Release Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag"
        required: true
      skip_publish:
        description: "Skip publishing to GitHub Releases (set y to skip)"
        required: false
      prerelease:
        description: "Publish as a pre-release, never marked Latest (set y)"
        required: false
# One run per tag at a time: two concurrent runs would both `ghr -delete` and
# recreate the release/tag, the later one overwriting the earlier one's APKs.
# Not cancelled: a build must not be aborted halfway through a publish.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
# Least privilege for every job; the publish job widens contents to write.
# Reusable workflows cannot exceed what is granted here.
permissions:
  contents: read
  actions: read
jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Check VERSION_NAME matches the tag
        # The tag must equal VERSION_NAME at the tagged commit, or ghr would publish a
        # release whose name doesn't match the APK version. Alpha tags (e.g. 1.7.2-a1)
        # follow the same rule — their nb4a.properties carries the alpha VERSION_NAME.
        # The tag goes through env, never interpolated into the script body.
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(grep '^VERSION_NAME=' nb4a.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::inputs.tag ($TAG) does not match VERSION_NAME ($VERSION) in nb4a.properties"
            exit 1
          fi
      - name: Check y/empty inputs
        # skip_publish / prerelease 只认 y 或留空：publish 的判断在表达式里做且不区分
        # 大小写，填 yes、true、1 都会真的发布并用 ghr -delete 重建 release；Y 在下面
        # 的 shell 判断里又不算预览版。输入同样只经 env 传入
        env:
          SKIP_PUBLISH: ${{ inputs.skip_publish }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          for pair in "skip_publish=$SKIP_PUBLISH" "prerelease=$PRERELEASE"; do
            case "${pair#*=}" in
              ""|y) ;;
              *)
                echo "::error::${pair%%=*} must be y or empty, got '${pair#*=}'"
                exit 1
                ;;
            esac
          done
      - name: Check prerelease matches the tag
        # 预览版 tag（-aN / -bN）必须带 prerelease=y，正式版不能带：漏填或写成 Y
        # 时预览版会作为正式版发布并顶掉 Latest。在构建前就拦下；输入同样只经 env 传入
        env:
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$TAG" =~ -[ab][0-9]+$ ]]; then
            if [ "$PRERELEASE" != "y" ]; then
              echo "::error::preview tag $TAG must be published with prerelease=y"
              exit 1
            fi
          elif [ "$PRERELEASE" = "y" ]; then
            echo "::error::stable tag $TAG must not be published as a pre-release"
            exit 1
          fi
  libcore:
    needs: validate
    uses: ./.github/workflows/libcore.yml
    with:
      ref: ${{ inputs.tag }}
  build:
    needs: libcore
    uses: ./.github/workflows/build-apk.yml
    with:
      gradle-task: app:assembleOssRelease
      ref: ${{ inputs.tag }}
    secrets: inherit
  publish:
    name: Publish Release
    if: github.event.inputs.skip_publish != 'y'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: APKs
          path: artifacts
      - name: Release
        env:
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          wget -O ghr.tar.gz https://github.com/tcnksm/ghr/releases/download/v0.13.0/ghr_v0.13.0_linux_amd64.tar.gz
          echo "c428627270ae26e206cb526cb8c7bdfba475dd278f6691ddaf863355adadfa13  ghr.tar.gz" | sha256sum -c -
          tar -xvf ghr.tar.gz
          mv ghr*linux_amd64/ghr .
          mkdir apks
          # publish policy: universal APK only; the ABI splits are built and
          # verified in the build job but never shipped as release assets
          find artifacts -name "*-universal.apk" -exec cp {} apks \;
          if [ -z "$(ls -A apks)" ]; then
            echo "::error::no universal APK to publish; aborting before ghr -delete removes the existing release and tag"
            exit 1
          fi
          # -delete drops the existing release AND its git tag, then recreates the
          # tag at the target commitish; without -c that is the default branch head,
          # so re-running a release for an older tag would silently move it off the
          # commit these APKs were built from. HEAD here is the checked-out tag.
          # 预览版在创建时就带 -prerelease：事后再改的话，发布后到改完之间它是
          # 正式 release，会短暂顶掉 Latest
          PRERELEASE_FLAG=()
          if [ "$PRERELEASE" = "y" ]; then
            PRERELEASE_FLAG=(-prerelease)
          fi
          ./ghr -delete -c "$(git rev-parse HEAD)" "${PRERELEASE_FLAG[@]}" -n "$TAG" "$TAG" apks
