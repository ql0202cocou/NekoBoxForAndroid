on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out (empty = caller's ref)"
        required: false
        type: string
jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: LibCore Cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/libs/libcore.aar
          # only the core build inputs belong in the key; hashing all of buildScript/**
          # forced a full gomobile rebuild on unrelated script edits (e.g. plugins.sh bumps)
          # exclusions keep the post-job key re-evaluation off the gitignored build outputs
          # the toolchain versions are pinned in the key so a Go/NDK bump forces a rebuild.
          # NOTE: only the minor line is in the key, and go-version below floats within
          # it, so a Go 1.26.x patch release does NOT invalidate the cache — clear the
          # Actions cache by hand when a patch matters (e.g. a crypto/tls fix).
          key: libcore-go1.26-ndk25.0.8775105-${{ hashFiles('.github/workflows/libcore.yml', 'run', 'buildScript/lib/core.sh', 'buildScript/lib/core/**', 'buildScript/init/env.sh', 'buildScript/init/env_ndk.sh', 'buildScript/init/env_gobin.sh', 'libcore/**', '!libcore/.build/**', '!libcore/libcore.aar') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # pinned to the 1.26 line; a floating ^1.26 would drift to 1.27.x
          # while go.mod says 1.26.0
          go-version: '1.26'
          cache-dependency-path: libcore/go.sum
      - name: Install NDK 25.0.8775105
        if: steps.cache.outputs.cache-hit != 'true'
        # ubuntu-latest images ship only the latest NDK (27.x); without this step
        # buildScript/init/env_ndk.sh silently falls back to it and the core is
        # built with the wrong NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.0.8775105" > /dev/null
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Upload LibCore
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          # the .aar is already a zip; artifact only hands off between jobs in one run
          compression-level: 0
          retention-days: 1
  test:
    name: Go Test (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Version Consistency Check
        # guards the versions pinned in several places (go.mod pair, NDK, Go,
        # compileSdk/build-tools) against drifting apart; no toolchain needed
        run: ./run lib check_versions
      - name: Install Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # same 1.26 line as the build job above and libcore/go.mod
          go-version: '1.26'
          cache-dependency-path: libcore/go.sum
      - name: Download Geo Assets
        # the geo cache tests need real databases; the download script verifies
        # pinned sha256, and the .xz is kept so the assets dir is untouched
        run: |
          ./run lib assets
          xz -dk app/src/main/assets/sing-box/geoip.db.xz app/src/main/assets/sing-box/geosite.db.xz
      - name: Go Test
        # -checklinkname=0 is required: libcore/certs.go linknames
        # crypto/x509.systemRootsMu, which Go 1.23+ rejects at link time
        # (same flag as libcore/build.sh)
        env:
          NEKO_TEST_GEOIP_DB: ${{ github.workspace }}/app/src/main/assets/sing-box/geoip.db
          NEKO_TEST_GEOSITE_DB: ${{ github.workspace }}/app/src/main/assets/sing-box/geosite.db
        run: cd libcore && go test -ldflags=-checklinkname=0 ./...
      - name: Go Test (sing-box, race)
        # vendored sing-box 是嵌套 module，上面的 ./... 覆盖不到它；
        # 这里用 -race 跑补丁所在的包（含两个自建补丁的回归测试：
        # dns fallback 动作、trackersAccess 锁）。
        # -race 需要 CGO，ubuntu runner 默认 CGO_ENABLED=1
        run: cd libcore/sing-box && go test -race ./dns/... ./route/...
