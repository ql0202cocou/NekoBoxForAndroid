on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out (empty = caller's ref)"
        required: false
        type: string
# runner 镜像固定为 ubuntu-24.04，不用 ubuntu-latest：后者指向哪个系统版本由 GitHub 决定，
# 换版本后构建失败分不清是代码还是环境的问题。升级镜像时所有 workflow 的 runs-on 一起改
jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: LibCore Cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/libs/libcore.aar
          # key 只算核心构建的输入：算整个 buildScript/** 时，无关脚本的改动（如 plugins.sh 升级）也会
          # 触发整次 gomobile 重编；排除项让任务结束时重算 key 不受 gitignore 的构建产物影响。
          # 工具链版本写进 key，Go / NDK 升级（含 Go 的补丁版本）就会重编。Go 写完整版本、与下面两处
          # go-version 相同（check_versions 检查）：setup-go 默认不查最新，只写 1.26 时用的是 runner
          # 镜像预装的补丁版本（1.8.1 发布时是 1.26.8），出了安全补丁也用不上
          key: libcore-go1.26.10-ndk25.0.8775105-${{ hashFiles('.github/workflows/libcore.yml', 'run', 'buildScript/lib/core.sh', 'buildScript/lib/core/**', 'buildScript/init/env.sh', 'buildScript/init/env_ndk.sh', 'buildScript/init/env_gobin.sh', 'libcore/**', '!libcore/.build/**', '!libcore/libcore.aar') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # 固定到 1.26 线的具体补丁版本（与 libcore/go.mod 的 1.26 线、上面缓存 key 里的版本一致）；
          # 出新补丁时三处一起改。只写 1.26 不会自动取最新，浮动的 ^1.26 又会漂到 1.27.x
          go-version: '1.26.10'
          cache-dependency-path: libcore/go.sum
      - name: Install NDK 25.0.8775105
        if: steps.cache.outputs.cache-hit != 'true'
        # runner 镜像不带 NDK 25，预装的是更新的版本（27 及以上）；没有这一步，
        # buildScript/init/env_ndk.sh 找不到 NDK 25 会直接报错退出
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.0.8775105" > /dev/null
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Upload LibCore
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          # the .aar is already a zip; artifact only hands off between jobs in one run
          compression-level: 0
          retention-days: 1
  test:
    name: Go Test (LibCore)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Version Consistency Check
        # guards the versions pinned in several places (go.mod pair, NDK, Go,
        # compileSdk/build-tools) against drifting apart; no toolchain needed
        run: ./run lib check_versions
      - name: Install Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # 与上面构建任务的版本相同
          go-version: '1.26.10'
          cache-dependency-path: libcore/go.sum
      - name: Download Geo Assets
        # geo 缓存测试要用真实数据库，下载脚本取上游最新发布并按该发布附带的 .sha256sum 校验；测试只读，
        # 直接用 assets 里的文件
        run: ./run lib assets
      - name: Go Test
        # 命令与 -checklinkname 的原因见 buildScript/lib/test.sh
        env:
          NEKO_TEST_GEOIP_DB: ${{ github.workspace }}/app/src/main/assets/sing-box/geoip.db
          NEKO_TEST_GEOSITE_DB: ${{ github.workspace }}/app/src/main/assets/sing-box/geosite.db
        run: ./run lib test
      - name: Go Test (sing-box, race)
        # vendored sing-box 是嵌套 module，上面的 ./... 覆盖不到它；
        # 这里用 -race 跑补丁所在的包（含自建补丁的回归测试：dns fallback 动作、
        # dialer 的 DoNotSelectInterface、SOCKS5 UDP 关联的来源声明、WireGuard 启动报错不带密钥、
        # WireGuard 选 bind 与 ClientBind 的退避和竞争）。
        # fork 自建的回归测试所在包都要列进这一步。
        # -race 需要 CGO，ubuntu runner 默认 CGO_ENABLED=1
        run: cd libcore/sing-box && go test -race ./dns/... ./route/... ./common/dialer/... ./protocol/socks/... ./transport/wireguard/...
